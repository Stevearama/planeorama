name: Daily Flight Data Collection

on:
  schedule:
    # Runs at 08:00 UTC daily — after midnight has passed in all US time zones
    # so yesterday's data is complete on OpenSky.
    - cron: '0 8 * * *'
  # Allows manual runs from the GitHub Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours — well within GitHub's 6-hour job limit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight collector
        env:
          OPENSKY_CLIENT_ID:     ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python fetch_flights.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) flight update"
          git push
